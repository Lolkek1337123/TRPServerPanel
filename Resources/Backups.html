<!DOCTYPE html>
<html lang="ru">
<head>
    <script defer src="js/alpine.min.js"></script>
    <meta charset="UTF-8">
    <script>
        if (window.self !== window.top) {
            document.documentElement.classList.add('in-iframe');
            document.addEventListener('DOMContentLoaded', () => {
                document.body.classList.add('in-iframe');
            });
            
            // Inside iframe we MUST use window.parent.postMessage wrapper to send messages to C#,
            // and we MUST override/mock window.chrome.webview to route through window.parent.
            const target = new EventTarget();
            const mockWebview = {
                postMessage: function(msg) {
                    window.parent.postMessage({ action: "forward_to_csharp", payload: msg }, "*");
                },
                addEventListener: function(type, listener) {
                    target.addEventListener(type, listener);
                },
                removeEventListener: function(type, listener) {
                    target.removeEventListener(type, listener);
                },
                dispatchEvent: function(event) {
                    target.dispatchEvent(event);
                }
            };
            
            try {
                Object.defineProperty(window, 'chrome', {
                    value: { webview: mockWebview },
                    writable: true,
                    configurable: true
                });
            } catch (e) {
                window.chrome = { webview: mockWebview };
            }
            
            window.addEventListener('message', event => {
                if (event.source === window.parent) {
                    if (event.data) {
                        try {
                            const newEvent = new MessageEvent('message', {
                                data: event.data
                            });
                            window.chrome.webview.dispatchEvent(newEvent);
                        } catch (e) {
                            console.error('Error dispatching message event:', e);
                        }
                    }
                }
            });
        }
    </script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRP BACKUP MANAGER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body x-data="backupManager()" x-init="init()" class="h-screen flex flex-col p-4">
    <!-- Header -->
    <header class="h-16 flex items-center px-4 justify-between border-b border-white/5 bg-black/20 mb-8 flex-shrink-0" @mousedown="onDrag($event)">
        <div class="flex items-center space-x-6">
            <button @click="navigateTo('Dashboard.html')" class="w-10 h-10 glass flex items-center justify-center hover:bg-white/10 transition-all text-gray-500 hover:text-white" title="Назад">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="w-12 h-12 bg-red-600/10 border border-red-500/20 flex items-center justify-center text-red-500 shadow-lg">
                <i class="fas fa-archive text-xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black italic tracking-tighter text-primary pointer-events-none">BACKUP REPOSITORY</h1>
                <p class="text-[9px] text-gray-500 font-bold tracking-[0.3em] uppercase pointer-events-none">Management & Data Redundancy</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <button @click="createBackup()" :disabled="isCreating" class="px-8 py-3 bg-red-600 hover:bg-red-700 disabled:opacity-50 text-[10px] font-black uppercase tracking-widest transition-all">
                <i class="fas fa-plus mr-2"></i> Создать копию
            </button>
        </div>
    </header>

    <div x-show="isCreating" class="mb-8 p-6 glass border-red-500/20 bg-red-500/5 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <div class="w-2 h-2 bg-red-500 animate-pulse"></div>
            <span class="text-[10px] font-black uppercase tracking-widest">Выполняется резервное копирование...</span>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto space-y-4 pr-4">
        <template x-for="backup in backups" :key="backup.Id">
            <div class="backup-card glass p-6 border border-white/5 transition-all flex items-center justify-between">
                <div class="flex items-center space-x-6">
                    <div class="w-12 h-12 flex items-center justify-center bg-white/5 text-xl">
                        <i class="fas fa-archive text-red-500"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-3 mb-1">
                            <span x-text="'ID: ' + backup.Id" class="text-[10px] font-black text-red-500 tracking-widest"></span>
                            <span x-text="backup.Type" class="px-2 py-0.5 bg-white/5 text-[8px] font-black uppercase tracking-widest text-white/40"></span>
                        </div>
                        <div x-text="formatDate(backup.CreatedAt)" class="text-lg font-bold tracking-tight"></div>
                        <div class="text-[9px] font-black uppercase tracking-widest text-white/20 mt-1">
                            Размер: <span x-text="formatSize(backup.SizeBytes)" class="text-white/40"></span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button class="w-10 h-10 flex items-center justify-center hover:text-red-500 transition-colors" title="Восстановить">
                        <i class="fas fa-undo-alt"></i>
                    </button>
                    <button class="w-10 h-10 flex items-center justify-center hover:text-red-500 transition-colors" title="Скачать">
                        <i class="fas fa-download"></i>
                    </button>
                    <button @click="deleteBackup(backup)" class="w-10 h-10 flex items-center justify-center hover:text-red-500 transition-colors" title="Удалить">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>
        </template>

        <template x-if="backups.length === 0 && !isCreating">
            <div class="h-64 flex flex-col items-center justify-center text-white/10">
                <i class="fas fa-ghost text-4xl mb-4"></i>
                <span class="text-[10px] font-black uppercase tracking-[0.4em]">Нет резервных копий</span>
            </div>
        </template>
    </div>

    <script>
        function backupManager() {
            return {
                backups: [],
                isCreating: false,

                onDrag(e) {
                    if (e.target.closest('button, input, select, textarea, .cyber-btn, [onclick], [x-on\\:click], [\\@click]')) return;
                    window.chrome?.webview?.postMessage({ action: "drag" });
                },

                init() {
                    document.body.classList.add('fade-in');
                    this.refresh();

                    if (window.chrome?.webview) {
                        window.chrome.webview.addEventListener('message', (e) => {
                            if (e.data.type === 'backup_list') {
                                this.backups = JSON.parse(e.data.items).sort((a,b) => new Date(b.CreatedAt) - new Date(a.CreatedAt));
                            } else if (e.data.type === 'backup_status') {
                                this.isCreating = false;
                                this.refresh();
                            }
                        });
                    }
                },

                refresh() {
                    window.chrome?.webview?.postMessage({ action: 'get_backups' });
                },

                createBackup() {
                    this.isCreating = true;
                    window.chrome?.webview?.postMessage({ action: 'trigger_backup' });
                },

                deleteBackup(backup) {
                    if (confirm('Вы уверены, что хотите удалить эту резервную копию?')) {
                        // Implement delete bridge if needed
                        alert('Создание пока не подключено к API');
                    }
                },

                navigateTo(url) {
                    if (url === 'Dashboard.html') {
                        window.parent.postMessage({ action: 'close_subpage' }, '*');
                    } else {
                        document.body.classList.remove('fade-in');
                        setTimeout(() => location.href = url, 300);
                    }
                },

                formatDate(dateStr) {
                    const d = new Date(dateStr);
                    return d.toLocaleString('ru-RU', { 
                        day: '2-digit', month: 'long', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });
                },

                formatSize(bytes) {
                    if (!bytes) return '0 B';
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
                }
            }
        }
    </script>
</body>
</html>
